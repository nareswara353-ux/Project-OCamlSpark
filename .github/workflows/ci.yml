name: OCaml Hybrid Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: OCaml Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make git libffi-dev pkg-config

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2.0'
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          opam install -y dune ctypes-foreign alcotest ocamlformat

      - name: Build project
        run: |
          eval $(opam env)
          dune build 2>&1

      - name: Run engine unit tests
        run: |
          eval $(opam env)
          dune exec tests/ocaml_tests.exe

      - name: Run integration tests
        run: |
          eval $(opam env)
          dune exec tests/integration_test.exe

      - name: Run fuser tests
        run: |
          eval $(opam env)
          dune exec tests/fuser_test.exe

      - name: Run main executable smoke test
        run: |
          eval $(opam env)
          dune exec engine_ocaml/main.exe

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocaml-binaries
          path: |
            _build/default/engine_ocaml/main.exe
            _build/default/tests/*.exe
          if-no-files-found: warn
          retention-days: 7
