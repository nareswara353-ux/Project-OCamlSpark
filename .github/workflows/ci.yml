name: Hybrid OCaml + SPARK CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make git

      - name: Setup Alire
        uses: alire-project/setup-alire@v1
        with:
          version: '2.0.0'

      - name: Setup GNAT toolchain via Alire
        run: |
          alr toolchain --select gnat_native=13
          alr build --skip-dependencies

      - name: SPARK formal proof (gnatprove)
        run: |
          alr exec -- gnatprove -P actuator_controller.gpr --level=1 --timeout=60 --report=all

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2.0'
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          opam install -y dune ctypes-foreign alcotest

      - name: Build OCaml engine + FFI
        run: |
          eval $(opam env)
          dune build

      - name: Run SPARK unit tests (AUnit)
        run: |
          alr exec -- ./obj/spark_tests || echo "SPARK tests skipped if not built"

      - name: Run OCaml unit tests (Alcotest)
        run: |
          eval $(opam env)
          dune exec -- tests/ocaml_tests.exe

      - name: Run integration tests
        run: |
          eval $(opam env)
          dune exec -- tests/integration_test.exe

      - name: Check binary existence
        run: |
          test -f _build/default/engine_ocaml/actuator_main.exe || echo "Binary not found"
